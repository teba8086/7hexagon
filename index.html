
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>천문 현상 대칭 분석 (2020-2027)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              orbitron: ['Orbitron', 'sans-serif'],
            },
            colors: {
              space: {
                950: '#05060B',
                900: '#0B0D17',
                800: '#151932',
                700: '#1E2342',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0B0D17;
        color: #E2E8F0;
        overflow-x: hidden; 
        -webkit-font-smoothing: antialiased;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .animate-fadeIn { animation: fadeIn 0.6s ease-out forwards; }
      @keyframes fadeIn {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
      }

      .eclipse-aura {
          box-shadow: 0 0 30px rgba(250, 204, 21, 0.2);
          transition: all 0.5s ease;
      }
      .eclipse-aura:hover {
          box-shadow: 0 0 50px rgba(250, 204, 21, 0.4);
      }

      /* Mobile Card Styles to prevent stretching */
      .mobile-event-card {
          word-break: keep-all;
          overflow-wrap: break-word;
      }

      @keyframes orbit {
          from { transform: rotate(0deg) translateX(40px) rotate(0deg); }
          to { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
      }
      .moon-orbit {
          animation: orbit 10s linear infinite;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "jszip": "https://esm.sh/jszip@^3.10.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 1. Constants & Data ---
        const EclipseType = { SOLAR: 'SOLAR', LUNAR: 'LUNAR' };
        const CENTER_DATE = "2024-04-08";
        const START_BOUNDARY = { date: "2020-10-02", desc: "초막절 시작" };
        const END_BOUNDARY = { date: "2027-10-15", desc: "초막절 종료" };
        
        const PAIRS = [
            { id: "A", left: { id: "A_L", date: "2020-12-14", type: EclipseType.SOLAR, desc: "개기일식" }, right: { id: "A_R", date: "2027-08-02", type: EclipseType.SOLAR, desc: "개기일식" } },
            { id: "B", left: { id: "B_L", date: "2021-12-04", type: EclipseType.SOLAR, desc: "개기일식" }, right: { id: "B_R", date: "2026-08-12", type: EclipseType.SOLAR, desc: "개기일식" } },
            { id: "C", left: { id: "C_L", date: "2022-05-16", type: EclipseType.LUNAR, desc: "개기월식" }, right: { id: "C_R", date: "2026-03-03", type: EclipseType.LUNAR, desc: "개기월식" } },
            { id: "D", left: { id: "D_L", date: "2022-11-08", type: EclipseType.LUNAR, desc: "개기월식" }, right: { id: "D_R", date: "2025-09-07", type: EclipseType.LUNAR, desc: "개기월식" } }
        ];

        // --- 2. Utils ---
        const calculateDaysBetween = (date1, date2) => {
            const d1 = new Date(date1).getTime();
            const d2 = new Date(date2).getTime();
            return Math.round(Math.abs((d2 - d1) / (1000 * 60 * 60 * 24)));
        };

        const getLocalDateString = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const playClickSound = () => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const oscillator = ctx.createOscillator();
                const gain = ctx.createGain();
                oscillator.connect(gain);
                gain.connect(ctx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(1200, ctx.currentTime);
                gain.gain.setValueAtTime(0.04, ctx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05); 
                oscillator.start();
                oscillator.stop(ctx.currentTime + 0.05);
            } catch (e) {}
        };

        // --- 3. Components ---

        const Visualization = () => {
            const [speechMarkers, setSpeechMarkers] = useState([]);
            
            const width = 800;
            const height = 480;
            const margin = { top: 60, right: 60, bottom: 60, left: 60 };
            const graphWidth = width - margin.left - margin.right;
            const centerTime = new Date(CENTER_DATE).getTime();
            const timeBuffer = 1350 * 24 * 60 * 60 * 1000;
            const minTime = centerTime - timeBuffer;
            const maxTime = centerTime + timeBuffer;

            const getX = (dateStr) => {
                const time = new Date(dateStr).getTime();
                return margin.left + ((time - minTime) / (maxTime - minTime)) * graphWidth;
            };

            const playTTSFallback = (text, onEnded) => {
                try {
                    const url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ko&q=${encodeURIComponent(text)}`;
                    const audio = new Audio(url);
                    audio.onended = onEnded;
                    audio.onerror = onEnded;
                    audio.play().catch(onEnded);
                } catch (e) { onEnded(); }
            };

            const speakBreifing = () => {
                playClickSound();
                const today = getLocalDateString();
                const sequence = [
                    { date: "2026-03-03", label: "요셉 블러드문", id: "C_R" },
                    { date: "2026-03-27", label: "1차 휴거예상", id: "G1", ghost: true },
                    { date: "2026-03-31", label: "유월절 혼인잔치", id: "G2", ghost: true, gold: true },
                    { date: "2026-08-12", label: "개기일식", id: "B_R" },
                    { date: "2026-09-20", label: "2차 휴거예상", id: "G3", ghost: true }
                ];

                setSpeechMarkers([]);
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();

                let i = 0;
                const playNext = () => {
                    if (i >= sequence.length) return;
                    const item = sequence[i];
                    const days = calculateDaysBetween(today, item.date);
                    const text = `${item.label}인 ${item.date}까지는 ${days}일 남았습니다.`;
                    
                    setSpeechMarkers(prev => [...prev, { ...item, days }]);

                    const next = () => { i++; setTimeout(playNext, 450); };

                    if ('speechSynthesis' in window && window.speechSynthesis.getVoices().length > 0) {
                        const u = new SpeechSynthesisUtterance(text);
                        u.lang = 'ko-KR';
                        u.onend = next;
                        u.onerror = () => playTTSFallback(text, next);
                        window.speechSynthesis.speak(u);
                    } else {
                        playTTSFallback(text, next);
                    }
                };
                playNext();
            };

            return (
                <div className="bg-space-800/50 rounded-2xl border border-space-700 p-4 md:p-8 relative overflow-hidden shadow-2xl animate-fadeIn">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="font-orbitron font-bold text-cyan-400 flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-cyan-500 animate-ping"></span>
                            Timeline Visualization
                        </h3>
                        <button onClick={speakBreifing} className="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg transition-all flex items-center gap-2 group">
                            <svg className="w-4 h-4 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 20 20"><path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414z"></path></svg>
                            음성 안내 시작
                        </button>
                    </div>

                    <div className="relative overflow-x-auto no-scrollbar">
                        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto min-w-[700px]">
                            {/* Axis */}
                            <line x1={margin.left} y1={height/2} x2={width - margin.right} y2={height/2} stroke="#334155" strokeWidth="2" />
                            
                            {/* Center Event */}
                            <g>
                                <circle cx={getX(CENTER_DATE)} cy={height/2} r="12" fill="none" stroke="#EAB308" strokeWidth="2" className="animate-pulse" />
                                <circle cx={getX(CENTER_DATE)} cy={height/2} r="6" fill="#EAB308" />
                                <text x={getX(CENTER_DATE)} y={height/2 + 30} textAnchor="middle" fill="#EAB308" fontSize="12" fontWeight="bold">2024-04-08 (중심)</text>
                            </g>

                            {/* Pairs */}
                            {PAIRS.map((p, idx) => {
                                const lx = getX(p.left.date);
                                const rx = getX(p.right.date);
                                const isTop = idx % 2 === 0;
                                const yOffset = isTop ? -80 : 80;
                                
                                return (
                                    <g key={p.id}>
                                        <path d={`M ${lx} ${height/2} Q ${(lx+rx)/2} ${height/2 + (isTop ? -150 : 150)} ${rx} ${height/2}`} fill="none" stroke={p.left.type === EclipseType.SOLAR ? "#cbd5e1" : "#ef4444"} strokeWidth="1" strokeDasharray="5 5" opacity="0.4" />
                                        
                                        {/* Left node */}
                                        <circle cx={lx} cy={height/2} r="5" fill={p.left.type === EclipseType.SOLAR ? "white" : "#ef4444"} />
                                        <text x={lx} y={height/2 + (isTop ? -20 : 30)} textAnchor="middle" fill="#64748b" fontSize="10">{p.left.date}</text>
                                        
                                        {/* Right node */}
                                        <circle cx={rx} cy={height/2} r="5" fill={p.right.type === EclipseType.SOLAR ? "white" : "#ef4444"} />
                                        <text x={rx} y={height/2 + (isTop ? -20 : 30)} textAnchor="middle" fill="#64748b" fontSize="10">{p.right.date}</text>
                                    </g>
                                );
                            })}

                            {/* Speech Markers */}
                            {speechMarkers.map((m, idx) => {
                                const x = getX(m.date);
                                const isActive = true;
                                return (
                                    <g key={m.id} className="animate-fadeIn">
                                        <line x1={x} y1={height/2} x2={x} y2={height/2 - 120} stroke={m.gold ? "#fbbf24" : "#22d3ee"} strokeWidth="2" strokeDasharray="4 2" />
                                        <rect x={x - 50} y={height/2 - 160} width="100" height="40" rx="8" fill={m.gold ? "#78350f" : "#164e63"} stroke={m.gold ? "#fbbf24" : "#22d3ee"} strokeWidth="2" />
                                        <text x={x} y={height/2 - 142} textAnchor="middle" fill="white" fontSize="11" fontWeight="bold">{m.label}</text>
                                        <text x={x} y={height/2 - 128} textAnchor="middle" fill={m.gold ? "#fcd34d" : "#67e8f9"} fontSize="10">{m.days}일 남음</text>
                                    </g>
                                );
                            })}
                        </svg>
                    </div>
                </div>
            );
        };

        const DDayCalculator = () => {
            const [refDate, setRefDate] = useState(getLocalDateString());
            
            const events = [
                { name: "요셉 블러드문", date: "2026-03-03", desc: "요셉을 상징하는 개기월식 (블러드문)", highlight: true, color: "text-red-500" },
                { name: "니산월 10일 (1차 휴거)", date: "2026-03-27", desc: "첫 번째 신부 단장 및 휴거 예상일", highlight: true, color: "text-yellow-400" },
                { name: "유월절 혼인잔치", date: "2026-03-31", desc: "니산월 14일 유월절 / 어린양의 혼인잔치 시작", highlight: true, color: "text-green-400" },
                { name: "2026 개기일식", date: "2026-08-12", desc: "대칭 구조의 우측 날개 개기일식" },
                { name: "베냐민 블러드문", date: "2026-08-28", desc: "베냐민을 상징하는 개기월식 (블러드문)", highlight: true, color: "text-red-500" },
                { name: "대속죄일 (2차 휴거)", date: "2026-09-20", desc: "두 번째 휴거 예상 및 민족적 회개의 날", highlight: true, color: "text-yellow-400" },
                { name: "초막절 (대환란 시작)", date: "2026-09-25", desc: "하나님의 보호하심과 장막의 절기", color: "text-orange-400" }
            ];

            const getDDay = (target) => {
                const diff = calculateDaysBetween(refDate, target);
                const isPast = new Date(refDate) > new Date(target);
                if (diff === 0) return "D-Day";
                return isPast ? `D+${diff}` : `D-${diff}`;
            };

            return (
                <div className="max-w-5xl mx-auto py-6 md:py-12">
                    {/* Control Panel */}
                    <div className="bg-space-800 p-6 rounded-2xl border border-space-700 mb-10 shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
                        <div className="text-center md:text-left">
                            <h2 className="text-2xl md:text-3xl font-bold font-orbitron text-white">2026 D-Day Tracker</h2>
                            <p className="text-gray-400 text-sm mt-1">천문 징조와 절기까지 남은 시간을 확인하세요.</p>
                        </div>
                        <div className="flex items-center gap-4 w-full md:w-auto">
                            <input 
                                type="date" 
                                value={refDate} 
                                onChange={e => setRefDate(e.target.value)}
                                className="bg-space-900 border border-space-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500 flex-grow md:flex-grow-0"
                            />
                            <button 
                                onClick={() => { playClickSound(); setRefDate(getLocalDateString()); }}
                                className="bg-cyan-600 hover:bg-cyan-500 px-6 py-2 rounded-lg font-bold transition-all shadow-lg active:scale-95 whitespace-nowrap"
                            >
                                오늘로
                            </button>
                        </div>
                    </div>

                    {/* Mobile: Cards Layout (Fixed stretching) */}
                    <div className="md:hidden space-y-4 px-1">
                        {events.map((ev, i) => {
                            const dday = getDDay(ev.date);
                            const isPast = dday.includes('+');
                            return (
                                <div key={i} className={`p-5 rounded-xl border ${ev.highlight ? 'bg-space-800/80 border-cyan-900/40' : 'bg-space-900/50 border-space-700'} shadow-lg mobile-event-card`}>
                                    <div className="flex justify-between items-start mb-3 gap-3">
                                        <div className={`font-extrabold text-lg leading-tight ${ev.color || 'text-white'}`}>{ev.name}</div>
                                        <div className={`text-2xl font-mono font-black ${isPast ? 'text-gray-600' : 'text-cyan-400 shadow-cyan-500/20'}`}>{dday}</div>
                                    </div>
                                    <p className="text-sm text-gray-400 leading-relaxed opacity-80">{ev.desc}</p>
                                    <div className="mt-4 pt-3 border-t border-space-700/50 flex justify-between items-center text-[10px] uppercase tracking-widest text-gray-500">
                                        <span>Solar Date</span>
                                        <span className="font-mono">{ev.date}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Desktop: Table Layout */}
                    <div className="hidden md:block overflow-hidden rounded-2xl border border-space-700 shadow-2xl">
                        <table className="w-full text-left">
                            <thead className="bg-space-700/80 text-gray-400 uppercase text-[11px] tracking-widest font-bold">
                                <tr>
                                    <th className="px-8 py-5">이벤트 명칭</th>
                                    <th className="px-8 py-5">상세 설명</th>
                                    <th className="px-8 py-5">양력 날짜</th>
                                    <th className="px-8 py-5 text-center">남은 일수</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-space-700 bg-space-900/40">
                                {events.map((ev, i) => {
                                    const dday = getDDay(ev.date);
                                    const isPast = dday.includes('+');
                                    return (
                                        <tr key={i} className={`group transition-colors ${ev.highlight ? 'bg-space-800/20' : ''} hover:bg-space-700/30`}>
                                            <td className={`px-8 py-6 font-bold text-lg ${ev.color || 'text-white'}`}>{ev.name}</td>
                                            <td className="px-8 py-6 text-gray-400 text-sm leading-relaxed max-w-xs">{ev.desc}</td>
                                            <td className="px-8 py-6 font-mono text-gray-300">{ev.date}</td>
                                            <td className={`px-8 py-6 text-center font-black font-mono text-2xl ${isPast ? 'text-gray-600' : 'text-cyan-400 group-hover:scale-110 transition-transform'}`}>{dday}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('GRAPH');

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {/* Header */}
                    <header className="bg-space-950/90 backdrop-blur-xl sticky top-0 z-50 border-b border-space-800 h-20 flex items-center px-6 md:px-12 justify-between">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('GRAPH')}>
                            <div className="relative w-10 h-10 rounded-full bg-black border-2 border-yellow-500 eclipse-aura">
                                <div className="absolute top-1 left-1 w-8 h-8 rounded-full bg-black border border-yellow-500/50"></div>
                            </div>
                            <h1 className="text-xl md:text-2xl font-orbitron font-bold tracking-[0.2em] text-white">
                                ASTRO<span className="text-cyan-500">SYMMETRY</span>
                            </h1>
                        </div>
                        <nav className="flex gap-2">
                            <button onClick={() => { playClickSound(); setView('GRAPH'); }} className={`px-4 py-2 rounded-full text-xs font-bold transition-all ${view === 'GRAPH' ? 'bg-cyan-900/40 text-cyan-100 border border-cyan-500/50 shadow-lg shadow-cyan-500/10' : 'text-gray-500 hover:text-gray-300'}`}>대칭 구조</button>
                            <button onClick={() => { playClickSound(); setView('CALC'); }} className={`px-4 py-2 rounded-full text-xs font-bold transition-all ${view === 'CALC' ? 'bg-cyan-900/40 text-cyan-100 border border-cyan-500/50 shadow-lg shadow-cyan-500/10' : 'text-gray-500 hover:text-gray-300'}`}>D-Day 계산기</button>
                        </nav>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 md:px-8 py-8">
                        {view === 'GRAPH' ? (
                            <div className="space-y-12">
                                <div className="text-center py-6 animate-fadeIn">
                                    <h2 className="text-3xl md:text-5xl font-extrabold text-white mb-4 tracking-tight leading-tight">천문 현상 대칭 구조 <span className="text-cyan-500">(2020-2027)</span></h2>
                                    <p className="text-gray-400 max-w-2xl mx-auto text-sm md:text-base leading-relaxed">2024년 4월 8일 개기일식을 정점으로, 우주는 좌우 완벽한 대칭을 이루며 거대한 서사를 완성하고 있습니다.</p>
                                </div>
                                <Visualization />
                                <div className="bg-space-800/30 p-8 rounded-2xl border border-space-700 shadow-xl">
                                    <h4 className="text-xl font-bold text-white mb-6 border-l-4 border-yellow-500 pl-4">구조적 특징 분석</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 text-sm leading-relaxed text-gray-300">
                                        <div className="space-y-4">
                                            <p><strong className="text-yellow-400">1. 유대력 새해의 개기일식:</strong> 2024년 4월 8일 중심 사건은 유대력 종교력의 새해인 니산월 1일에 정확히 발생했습니다.</p>
                                            <p><strong className="text-red-400">2. 블러드문 대칭:</strong> 좌측의 월식(C_L, D_L)과 우측의 월식(C_R, D_R)이 중심으로부터 동일한 간격으로 배치되어 있습니다.</p>
                                        </div>
                                        <div className="space-y-4">
                                            <p><strong className="text-cyan-400">3. 시작과 끝의 일치:</strong> 분석 범위의 양 끝(2020년과 2027년)은 모두 유대력의 가장 큰 명절인 초막절(Sukkot)에 걸쳐 있습니다.</p>
                                            <p><strong className="text-white">4. 7년의 주기:</strong> 이 모든 현상은 정확히 성경적 완전수인 7년(2,556일)의 기간 안에서 하나의 육각형 구조를 형성합니다.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
